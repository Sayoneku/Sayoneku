<title id="title">Technical focus — AI systems, infrastructure and software development</title>
<desc id="desc">Diagram shows models connected through MCP and API tools to local systems. Three areas of technical focus: AI systems covering LLM context, tool calling, agent workflows and MCP; infrastructure covering Linux, Docker, networking and services; software and data covering Swift iOS, Python, TypeScript and data validation.</desc>
