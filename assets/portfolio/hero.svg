<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img"><title>Sayoneku — Independent developer</title><desc>Monochrome portfolio banner with an abstract orbital sculpture. iOS, web and self-hosted systems.</desc><defs>
<radialGradient id="glow"><stop stop-color="#777" stop-opacity=".14"/><stop offset="1" stop-color="#070707" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#333"/><stop offset=".65" stop-color="#bbb"/><stop offset="1" stop-color="#151515"/></linearGradient>
<radialGradient id="sphere" cx="30%" cy="24%"><stop stop-color="#555"/><stop offset=".35" stop-color="#1c1c1c"/><stop offset="1" stop-color="#090909"/></radialGradient>
<clipPath id="orb"><circle cx="1280" cy="250" r="171"/></clipPath>
</defs>
<rect width="1600" height="500" rx="24" fill="#070707"/>
<ellipse cx="1260" cy="250" rx="360" ry="310" fill="url(#glow)"/>
<circle cx="1280" cy="250" r="171" fill="url(#sphere)" stroke="url(#edge)" stroke-width="1.5"/>
<g clip-path="url(#orb)" fill="none" stroke="#cfcfcf" stroke-opacity=".2"><ellipse cx="1280" cy="110" rx="98.19" ry="20"/><ellipse cx="1280" cy="138" rx="129.22" ry="20"/><ellipse cx="1280" cy="166" rx="148.95" ry="20"/><ellipse cx="1280" cy="194" rx="161.57" ry="20"/><ellipse cx="1280" cy="222" rx="168.69" ry="20"/><ellipse cx="1280" cy="250" rx="171.00" ry="20"/><ellipse cx="1280" cy="278" rx="168.69" ry="20"/><ellipse cx="1280" cy="306" rx="161.57" ry="20"/><ellipse cx="1280" cy="334" rx="148.95" ry="20"/><ellipse cx="1280" cy="362" rx="129.22" ry="20"/><ellipse cx="1280" cy="390" rx="98.19" ry="20"/></g><ellipse cx="1280" cy="250" rx="252" ry="58" transform="rotate(-32 1280 250)" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="68" y="79" fill="#999" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="4">INDEPENDENT DEVELOPER</text><text x="58" y="286" fill="#f5f5f5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="178" font-weight="600" letter-spacing="-10">Sayoneku</text><text x="70" y="365" fill="#aaa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="400" >iOS. Web. Self-hosted systems.</text><path d="M70 430H960" stroke="#292929"/><text x="70" y="464" fill="#777" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="3">BUILD / EXPLORE / REFINE</text></svg>
