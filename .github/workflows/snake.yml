name: Generate Snake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/profile_cards.py"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    name: Refresh profile cards and contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Generate monochrome cards from public GitHub data
        run: python3 .github/scripts/profile_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate monochrome contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Sayoneku
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#111111&color_dots=#ebebeb,#d1d1d1,#999999,#666666,#333333
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161616,#444444,#777777,#aaaaaa,#dddddd

      - name: Verify all profile assets before publication
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          expected = [
              "stats.svg", "stats-dark.svg",
              "languages.svg", "languages-dark.svg",
              "github-contribution-grid-snake.svg",
              "github-contribution-grid-snake-dark.svg",
          ]
          for name in expected:
              path = Path("dist") / name
              svg = path.read_text(encoding="utf-8")
              root = ElementTree.fromstring(svg)
              assert root.tag.endswith("svg"), name
              assert "Something went wrong" not in svg, name
              assert "Resource not accessible" not in svg, name
              assert path.stat().st_size > 500, name
          print("Verified six SVG assets.")

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: Refresh profile cards and contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
