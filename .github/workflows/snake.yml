name: Generate Snake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    name: Refresh profile cards and contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate light statistics
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=Sayoneku&show_icons=true&hide_rank=true&hide_border=true&bg_color=00000000&title_color=111111&text_color=555555&icon_color=111111
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate dark statistics
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=Sayoneku&show_icons=true&hide_rank=true&hide_border=true&bg_color=00000000&title_color=FFFFFF&text_color=AAAAAA&icon_color=FFFFFF
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=Sayoneku&layout=compact&hide_border=true&bg_color=00000000&title_color=111111&text_color=555555
          path: dist/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=Sayoneku&layout=compact&hide_border=true&bg_color=00000000&title_color=FFFFFF&text_color=AAAAAA
          path: dist/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Keep statistics and language cards monochrome
        shell: python
        run: |
          from pathlib import Path
          import re

          def grey(match):
              colour = match.group(1)
              if len(colour) == 3:
                  colour = "".join(channel * 2 for channel in colour)
              red, green, blue = (int(colour[i:i + 2], 16) for i in (0, 2, 4))
              value = round(0.2126 * red + 0.7152 * green + 0.0722 * blue)
              return "#{0:02x}{0:02x}{0:02x}".format(value)

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")
              svg = re.sub(r"#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})(?![0-9a-fA-F])", grey, svg)
              path.write_text(svg, encoding="utf-8")

      - name: Generate monochrome contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Sayoneku
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#111111&color_dots=#ebebeb,#d1d1d1,#999999,#666666,#333333
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161616,#444444,#777777,#aaaaaa,#dddddd

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: Refresh profile cards and contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
